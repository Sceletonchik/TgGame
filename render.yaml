# render.yaml — GameArena Blueprint
# ─────────────────────────────────────────────────────────────────────────────
# ВАЖНО: после деплоя вручную прописать MINI_APP_URL во всех сервисах
# (URL фронтенда вида https://gamearena-frontend.onrender.com)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ══════════════════════════════════════════════════════════
  # 1. BACKEND — Node.js API + Socket.io
  # ══════════════════════════════════════════════════════════
  - type: web
    name: gamearena-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Прописать вручную после деплоя фронтенда:
      - key: MINI_APP_URL
        sync: false

  # ══════════════════════════════════════════════════════════
  # 2. FRONTEND — React + Vite (Static Site, не засыпает)
  # ══════════════════════════════════════════════════════════
  - type: web
    name: gamearena-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Прописать вручную: URL бэкенда (https://gamearena-backend.onrender.com)
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false

  # ══════════════════════════════════════════════════════════
  # 3. BOT — Python Background Worker (НЕ веб-сервис!)
  # ══════════════════════════════════════════════════════════
  - type: worker
    name: gamearena-bot
    runtime: python
    region: frankfurt
    plan: free
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      # ОБЯЗАТЕЛЬНО вписать вручную:
      - key: BOT_TOKEN
        sync: false
      # Прописать вручную: URL фронтенда
      - key: MINI_APP_URL
        sync: false
      # Прописать вручную: URL бэкенда (https://gamearena-backend.onrender.com)
      - key: API_URL
        sync: false
      - key: KEEPALIVE_INTERVAL
        value: "600"
