# render.yaml — GameArena Blueprint
# Деплой: render.com → New → Blueprint → выбрать репо → вписать BOT_TOKEN → Apply

services:

  # ══════════════════════════════════════════════════════════
  # 1. BACKEND — Node.js API + Socket.io
  # ══════════════════════════════════════════════════════════
  - type: web
    name: gamearena-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MINI_APP_URL
        fromService:
          name: gamearena-frontend
          type: web
          property: host
          envVarKey: MINI_APP_URL

  # ══════════════════════════════════════════════════════════
  # 2. FRONTEND — React + Vite (Static Site)
  # ══════════════════════════════════════════════════════════
  - type: web
    name: gamearena-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: gamearena-backend
          type: web
          property: host
          envVarKey: VITE_API_URL
      - key: VITE_SOCKET_URL
        fromService:
          name: gamearena-backend
          type: web
          property: host
          envVarKey: VITE_SOCKET_URL

  # ══════════════════════════════════════════════════════════
  # 3. BOT — Python (Background Worker)
  # ══════════════════════════════════════════════════════════
  - type: worker
    name: gamearena-bot
    runtime: python
    region: frankfurt
    plan: free
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      # ⬇ ЕДИНСТВЕННАЯ переменная которую нужно вписать вручную:
      - key: BOT_TOKEN
        sync: false
      # Всё остальное заполняется автоматически:
      - key: MINI_APP_URL
        fromService:
          name: gamearena-frontend
          type: web
          property: host
          envVarKey: MINI_APP_URL
      - key: API_URL
        fromService:
          name: gamearena-backend
          type: web
          property: host
          envVarKey: API_URL
      - key: KEEPALIVE_INTERVAL
        value: "600"
      # Явно указываем Python 3.11 тремя способами для надёжности:
      - key: PYTHON_VERSION
        value: "3.11"
