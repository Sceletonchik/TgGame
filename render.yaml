# render.yaml — GameArena Blueprint (все 3 сервиса на Render)
# ─────────────────────────────────────────────────────────────
# Деплой одной кнопкой:
#   1. Загрузить папку на GitHub (публичный или приватный репо)
#   2. render.com → New → Blueprint → выбрать репо
#   3. Render сам найдёт этот файл и создаст 3 сервиса
#   4. Вписать секреты: BOT_TOKEN (обязательно)
#   5. Click "Apply" — всё задеплоится автоматически
# ─────────────────────────────────────────────────────────────

services:

  # ══════════════════════════════════════════════════════════
  # 1. BACKEND — Node.js API + Socket.io
  # ══════════════════════════════════════════════════════════
  - type: web
    name: gamearena-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # MINI_APP_URL заполнится автоматически из URL фронтенда (см. ниже)
      - key: MINI_APP_URL
        fromService:
          name: gamearena-frontend
          type: web
          property: host
          envVarKey: MINI_APP_URL
      # PORT инжектируется Render автоматически — НЕ указывать вручную

  # ══════════════════════════════════════════════════════════
  # 2. FRONTEND — React + Vite (Static Site)
  # ══════════════════════════════════════════════════════════
  - type: web
    name: gamearena-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA: все пути → index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Заполняются автоматически из URL бэкенда
      - key: VITE_API_URL
        fromService:
          name: gamearena-backend
          type: web
          property: host
          envVarKey: VITE_API_URL
      - key: VITE_SOCKET_URL
        fromService:
          name: gamearena-backend
          type: web
          property: host
          envVarKey: VITE_SOCKET_URL

  # ══════════════════════════════════════════════════════════
  # 3. BOT — Python (Background Worker, никогда не засыпает)
  # ══════════════════════════════════════════════════════════
  - type: worker
    name: gamearena-bot
    runtime: python
    region: frankfurt
    plan: free
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      # ОБЯЗАТЕЛЬНО вписать вручную в Render Dashboard:
      - key: BOT_TOKEN
        sync: false
      # Заполняются автоматически:
      - key: MINI_APP_URL
        fromService:
          name: gamearena-frontend
          type: web
          property: host
          envVarKey: MINI_APP_URL
      - key: API_URL
        fromService:
          name: gamearena-backend
          type: web
          property: host
          envVarKey: API_URL
      - key: KEEPALIVE_INTERVAL
        value: "600"
